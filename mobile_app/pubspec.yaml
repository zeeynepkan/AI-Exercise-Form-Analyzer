name: mobile_app
description: "Exercise Form Analyzer Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  flutter_mp_pose_landmarker: ^0.1.0
  path_provider: ^2.1.5
  cupertino_icons: ^1.0.8
  #camera: ^0.11.4
  #tflite_flutter: ^0.12.1
  image: ^4.5.4
  flutter_tts: ^4.2.0
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/feature_columns.json
    - assets/models/scaler_params.json
    - assets/models/mlp_model.json
    - assets/exercise_icons/